utions by design · Plan, Design, Build, Service</p><p>Public reference: <a href="https://asg.com.pk/" target="_blank" rel="noreferrer">asg.com.pk</a><br>Public contact: info@asg.com.pk · +92 301 8451902</p></div><div class="roadmap-item"><h3>Local demo data</h3><p>Records currently stored in this browser: customers, projects, inventory, quotations, purchase orders, invoices, expenses, tickets, employees, tasks and leads.</p><p><b>Current storage:</b> localStorage · not shared between computers.</p>${btn('Reset all sample records',`resetDB()`,'primary')}</div></div>`}

tasks:{title:'Task',fields:[['title','Task title','text',true],['owner','Owner','text',true],['due','Due date','date',true],['priority','Priority','select',['Low','Medium','High']],['status','Status','select',['Open','In Progress','Done']]]}
};
function openCreateMenu(){let opts=[['customers','Customer'],['projects','Project'],['quotations','Quotation'],['inventory','Inventory item'],['tickets','Service ticket'],['invoices','Invoice']];document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Create a record</h2><p>Choose which demo module to add to.</p><div class="grid modulegrid">${opts.map(o=>`<div class="module-card"><h3>${o[1]}</h3><button class="btn" onclick="closeModal();openForm('${o[0]}')">Create →</button></div>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button></div></div></div>`}
function openForm(type,id=null){const cfg=configs[type];if(!cfg)return;const arr=db[type];let old=id?arr.find(x=>x.id===id):null;modalEdit={type,id};let fields=cfg.fields.map(f=>{let [key,label,kind,extra]=f;let val=old?.[key]??(kind==='date'?'2026-10-23':kind==='number'?'':(typeof extra==='function'?'':Array.isArray(extra)?extra[0]:''));let required=kind==='number'&&key==='progress'?false:!!extra&&extra===true;let input;if(kind==='select'){let choices=typeof extra==='function'?extra():extra;input=`<select name="${key}" ${required?'required':''}>${choices.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else input=`<input name="${key}" type="${kind}" value="${esc(val)}" ${required?'required':''} ${kind==='number'?'min="0"':''}>`;return `<div class="field"><label>${label}${required?' *':''}</label>${input}</div>`}).join('');document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveForm(event)"><h2>${old?'Edit':'Add'} ${cfg.title}</h2><p>Demo record · saved only in this browser</p><div class="formgrid">${fields}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${old?'Save changes':'Create record'}</button></div></form></div>`}
function saveForm(e){e.preventDefault();let {type,id}=modalEdit,cfg=configs[type],fd=new FormData(e.target),obj={};for(let f of cfg.fields){let k=f[0],kind=f[2];obj[k]=kind==='number'?Number(fd.get(k)||0):String(fd.get(k)||'').trim()}if(Object.values(obj).some(v=>v==='')){toast('Please complete required fields');return}let arr=db[type];if(id){let ix=arr.findIndex(x=>x.id===id);arr[ix]={...arr[ix],...obj}}else{let prefix={customers:'CUS',projects:'PRJ',inventory:'SKU',quotations:'QUO',suppliers:'SUP',purchaseOrders:'PO',invoices:'INV',expenses:'EXP',tickets:'TKT',employees:'EMP',tasks:'TSK',leads:'LED'}[type]||'REC';obj.id=prefix+'-'+(Date.now().toString().slice(-5));arr.unshift(obj)}saveDB();closeModal();render();toast(id?'Record updated':'Record created')}
function closeModal(){document.getElementById('modalroot').innerHTML='';modalEdit=null}
function removeRecord(type,id){if(confirm('Delete this demo record?')){db[type]=db[type].filter(x=>x.id!==id);saveDB();render();toast('Record deleted')}}
function adjustStock(id){let item=db.inventory.find(i=>i.id===id);let v=prompt(`Adjust quantity for ${item.name}. Enter change, e.g. 5 or -2:`, '1');if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||!Number.isInteger(n)||item.qty+n<0){toast('Enter a valid whole-number adjustment');return}item.qty+=n;saveDB();render();toast('Stock adjusted')}
function markPaid(id){let i=db.invoices.find(x=>x.id===id);i.status='Paid';saveDB();render();toast('Invoice marked paid in demo')}
function printQuote(id){let q=db.quotations.find(x=>x.id===id);let w=window.open('','_blank');if(!w){toast('Allow pop-ups to print quotation');return}w.document.write(`<html><head><title>${q.id}</title><style>body{font:16px Arial;padding:40px;color:#172033}h1{color:#17345b}table{width:100%;border-collapse:collapse;margin-top:30px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>ASG SYSTEMS</h1><p>Security Solutions by Design · DEMO QUOTATION</p><hr><h2>Quotation ${q.id}</h2><p>Customer: ${esc(q.customer)}<br>Date: ${q.date}</p><table><tr><th>Scope / items</th><th>Total</th></tr><tr><td>${esc(q.items)}</td><td>${money(q.total)}</td></tr></table><p>This is a fictional sample quotation for demo purposes only.</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportCSV(type){let arr=db[type]||[];if(!arr.length){toast('No records to export');return}let keys=[...new Set(arr.flatMap(Object.keys))],csv=[keys.join(','),...arr.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='asg-demo-'+type+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared')}
function filterTable(){let input=(document.getElementById('moduleSearch')?.value||'').toLowerCase(),status=document.getElementById('filterStatus')?.value||'';let map={'CRM & Customers':['customers',customerTable],'Projects':['projects',projectTable],'Inventory':['inventory',inventoryTable]};if(map[page]){let [type,fn]=map[page];let a=db[type].filter(x=>JSON.stringify(x).toLowerCase().includes(input)&&(!status||x.status===status||x.category===status));document.getElementById('tableholder').innerHTML=fn(a);return}let holder=document.getElementById('tableholder');if(!holder)return;let rows=holder.querySelectorAll('tbody tr');rows.forEach(tr=>{let text=tr.innerText.toLowerCase(),last=tr.querySelector('.badge')?.innerText||'';tr.style.display=text.includes(input)&&(!status||last===status||text.includes(status.toLowerCase()))?'':'none'})}
function go(p){page=p;render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();let found=db.customers.find(c=>JSON.stringify(c).toLowerCase().includes(q));if(found)go('CRM & Customers');else if(db.projects.find(p=>JSON.stringify(p).toLowerCase().includes(q)))go('Projects');else if(db.inventory.find(i=>JSON.stringify(i).toLowerCase().includes(q)))go('Inventory');else if(db.tickets.find(t=>JSON.stringify(t).toLowerCase().includes(q)))go('Service Desk');else toast('No matching sample record found')}});document.getElementById('mobilemenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
render();
</script>
</body></html>
